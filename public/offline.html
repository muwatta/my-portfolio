<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Muwatta Academy | Offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; }
      main { max-width: 32rem; text-align: center; }
      h1 { margin: 0 0 12px; font-size: 1.5rem; }
      p { color: #cbd5e1; line-height: 1.6; }
      button { min-height: 44px; border: 0; border-radius: 10px; background: #06b6d4; color: #082f49; padding: 0 18px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Downloaded Academy lessons and practice remain available. Reconnect to load content that has not been downloaded yet.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
