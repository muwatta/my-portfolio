# How the executor is meant to run.
#
# Read the network section before changing it. The first version of this file
# said `network_mode: none`, which reads like the most secure option available
# and is in fact the one that cannot work: a container with no network interfaces
# cannot be reached either, so the edge function's every request would fail. It
# was only found by building the image and trying to call it.
#
# The trade is real and there is no single-container answer:
#
#   network_mode: none      no egress, and no ingress either. Service dead.
#   internal: true network  no egress, and port publishing stops working too.
#   default bridge          ingress works, egress also works.
#
# Isolating the student program from the network needs a network namespace per
# job, which needs CAP_SYS_ADMIN, which is exactly the privilege the rest of this
# file exists to remove. So this container reaches the outside world, and the
# student's program shares that. Egress is therefore cut one level up, on the
# host, with the rules in executor/firewall-executor.sh. That is the only place
# it can be cut.

services:
  executor:
    build: .
    image: academy-cpp-executor
    restart: unless-stopped
    init: true
    environment:
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:?set EXECUTOR_TOKEN in .env}
      CXX: /usr/bin/g++
      WORK_DIR: /work
      TEST_TIMEOUT_MS: "5000"
      COMPILE_TIMEOUT_MS: "15000"
      MAX_MEMORY_MB: "256"
    # Bound to loopback on purpose. Put a TLS reverse proxy in front of it rather
    # than exposing this port to the internet: the service speaks plain HTTP and
    # holds a bearer token. Do not publish it on the host's public interface.
    ports:
      - "127.0.0.1:8080:8080"

    # Isolation that does not need a network namespace. All of this is verified
    # against the built image in src/__tests__/executor-container.test.js.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # Scratch space for the compiler and the program, writable but not
      # executable, so a student cannot stage a binary here and run it.
      - /tmp:rw,noexec,nosuid,size=64m
      # Compiled binaries go here and this one *is* executable, because the
      # grader has to run what it compiles. Without this split the whole
      # executor is useless: the compile succeeds and the exec is refused, so
      # every submission fails and nothing says why.
      # Two defaults of --tmpfs have to be overridden explicitly here, and both
      # were found only by running the image:
      #
      #   exec     Docker mounts every --tmpfs noexec by default, so the grader
      #            could not run what it compiled. Every submission failed, with
      #            no error anywhere: the compile succeeded and the exec was
      #            refused, which reads as a wrong answer.
      #   uid/gid  A tmpfs is mounted root-owned and the executor does not run as
      #            root, so mkdtemp failed with EACCES. Owned by the executor user
      #            rather than 1777 so nothing else on the host can write in.
      - /work:rw,exec,nosuid,size=64m,uid=10001,gid=10001,mode=0750
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0