<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
    <style>
      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: #f1f5f9;
        color: #0f172a;
        font-family:
          "DM Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      .prerender-shell {
        max-width: 72rem;
        margin: 0 auto;
        padding: 1.5rem;
        line-height: 1.6;
      }

      .prerender-shell header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: clamp(3rem, 10vh, 7rem);
      }

      .prerender-shell nav ul {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .prerender-shell a {
        color: #1d4ed8;
        font-weight: 600;
        text-decoration: none;
      }

      .prerender-shell main {
        max-width: 52rem;
        margin: 0 auto;
      }

      .prerender-shell h1 {
        margin: 0 0 1rem;
        font-family:
          "Space Grotesk", "DM Sans", ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(2.25rem, 7vw, 4.5rem);
        line-height: 1.08;
        letter-spacing: -0.04em;
      }

      .prerender-shell p {
        color: #475569;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #020617;
          color: #f1f5f9;
        }

        .prerender-shell p {
          color: #cbd5e1;
        }
      }
    </style>

    <!-- Primary identity -->
    <title>Muwatta | Abdullahi Musliudeen — Software Developer</title>
    <meta
      data-rh="true"
      name="description"
      content="Muwatta is the portfolio of Abdullahi Musliudeen, a Nigerian Software Developer building 10+ production projects with Django, PostgreSQL, Redis, Celery, and React/TypeScript."
    />
    <meta
      data-rh="true"
      name="author"
      content="Abdullahi Oladipupo Musliudeen"
    />
    <meta name="google-site-verification" content="googlef4aaf0c45794f166" />
    <link data-rh="true" rel="canonical" href="https://www.muwatta.com.ng/" />
    <meta name="theme-color" content="#0f172a" />
    <meta data-rh="true" name="robots" content="index, follow" />

    <!-- Icons -->
    <link
      rel="shortcut icon"
      href="/images/favicon-32x32.png"
      type="image/x-icon"
    />
    <link rel="apple-touch-icon" href="/images/favicon-32x32.png" />

    <!-- PWA Manifest & Mobile Web App -->

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Algorise Tech Explorers" />
    <meta name="msapplication-TileColor" content="#0a0f1a" />

      data-rh="true"
      name="twitter:title"
      content="Abdullahi Musliudeen — Software Developer"

      data-rh="true"
      name="twitter:description"
      content="Software Developer building production systems with Django, Django REST Framework, PostgreSQL, Redis, and React."
